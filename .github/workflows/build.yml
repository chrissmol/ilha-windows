name: Build and optionally sign

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      sign:
        description: Request SignPath signing (version tag and configured account required)
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Compile
        shell: powershell
        run: .\Compilar.ps1
      - name: Check application
        shell: powershell
        run: .\scripts\Test.ps1
      - name: Upload WPF visual checks
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ilha-visual-previews
          path: |
            Dados/preview-*.png
            Dados/preview-notes.txt
          if-no-files-found: error
      - name: Package unsigned build
        shell: powershell
        run: .\scripts\Package.ps1 -SkipBuild
      - name: Upload verifiable unsigned artifact
        id: unsigned
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ilha-windows-unsigned
          path: dist/Ilha-Windows-unsigned.zip
          if-no-files-found: error
      - name: Check signing configuration
        if: github.event_name == 'workflow_dispatch' && inputs.sign
        shell: powershell
        env:
          SIGNING_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNING_ORG: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNING_PROJECT: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNING_POLICY: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
        run: |
          if (-not $env:GITHUB_REF.StartsWith('refs/tags/v')) { throw 'Signing requires a version tag.' }
          foreach ($name in @('SIGNING_TOKEN','SIGNING_ORG','SIGNING_PROJECT','SIGNING_POLICY')) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) { throw "Missing signing setting: $name" }
          }
      - name: Submit manual signing request
        if: github.event_name == 'workflow_dispatch' && inputs.sign && startsWith(github.ref, 'refs/tags/v')
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed
      - name: Verify returned signed ZIP
        if: github.event_name == 'workflow_dispatch' && inputs.sign && startsWith(github.ref, 'refs/tags/v')
        shell: powershell
        run: |
          $archive = Get-ChildItem signed -Filter '*.zip' -Recurse
          if (@($archive).Count -ne 1) { throw 'Expected exactly one signed distribution ZIP.' }
          .\scripts\Verify-SignedPackage.ps1 -Archive $archive.FullName
          Copy-Item -LiteralPath $archive.FullName -Destination dist/Ilha-Windows.zip
      - name: Upload verified signed artifact
        if: github.event_name == 'workflow_dispatch' && inputs.sign && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ilha-windows-signed
          path: dist/Ilha-Windows.zip
          if-no-files-found: error
